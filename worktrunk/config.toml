# Global (all-repos) worktrunk config.
# Symlinks gitignored env-like files (.env, .env.*, *.env, .envrc) from the main checkout into
# every new/switched-to worktree, so per-machine config is never missing and never copied.
# Runs as blocking pre-* hooks so the script can prompt on the terminal before replacing a real
# file (post-* hooks are detached with no terminal). Script: ~/.config/worktrunk/hooks/link-env-files.sh
# pre-switch's worktree_path is the source when the switch creates a worktree, so pre-switch only
# runs when the target already has one (target_worktree_path set); pre-start covers creation.

[pre-start]
link-env = "$HOME/.config/worktrunk/hooks/link-env-files.sh '{{ repo_path }}' '{{ worktree_path }}'"

[pre-switch]
link-env = "{% if target_worktree_path %}$HOME/.config/worktrunk/hooks/link-env-files.sh '{{ repo_path }}' '{{ target_worktree_path }}'{% endif %}"
